                                        <div className="space-y-6 fade-in">
                                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100"><i className="fas fa-shield-alt mr-2"></i><strong>Buku Log Audit Ketertelusuran:</strong> Menampilkan pencatatan riwayat distribusi komoditas secara holistik dan tidak dapat dimodifikasi oleh entitas tidak berwenang.</div>

                                            {user.role === 'admin' && (
                                                <form onSubmit={handleKoreksi} className="bg-orange-50 border border-orange-200 p-4 rounded-xl grid grid-cols-2 gap-4 mb-6">
                                                    <div className="col-span-2 text-xs font-bold text-orange-800 uppercase">Panel Kalibrasi Otoritas Administrator</div>
                                                    <div><label className="block text-xs text-orange-700 mb-1">Parameter Terdahulu (Biomassa)</label><input readOnly value={koreksiForm.oldVal} className="w-full border border-orange-200 bg-orange-100 p-2 rounded text-orange-600 text-sm" /></div>
                                                    <div><label className="block text-xs text-orange-700 mb-1">Parameter Rekonsiliasi Baru</label><input required type="number" step="0.1" value={koreksiForm.newVal} onChange={e=>setKoreksiForm({...koreksiForm, newVal: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                    <div className="col-span-2"><label className="block text-xs text-orange-700 mb-1">Justifikasi Kalibrasi (Kewajiban Administratif)</label><input required type="text" value={koreksiForm.reason} onChange={e=>setKoreksiForm({...koreksiForm, reason: e.target.value})} placeholder="Contoh: Kalibrasi pengukuran instrumen operasional pelabuhan." className="w-full border p-2 rounded text-sm" /></div>
                                                    <button type="submit" className="col-span-2 bg-orange-500 text-white py-2 rounded-lg text-xs font-bold shadow">Eksekusi Penetapan Rekonsiliasi</button>
                                                </form>
                                            )}

                                            <div className="relative border-l-2 border-gray-200 ml-3 space-y-4 pb-2">
                                                {lot.history.slice().reverse().map((h, i) => (
                                                    <div key={i} className="relative pl-5">
                                                        <div className="absolute w-3 h-3 bg-situna-main rounded-full -left-[7px] top-1"></div>
                                                        <div className="bg-white p-3 rounded-lg border border-gray-100 shadow-sm text-xs text-gray-700">
                                                            <p className="font-medium leading-relaxed text-justify">{h.action}</p>
                                                            <div className="text-[9px] text-gray-400 mt-2 font-bold uppercase"><i className="fas fa-user text-situna-main mr-1"></i> {h.actor} &nbsp;&bull;&nbsp; <i className="fas fa-clock text-situna-main mx-1"></i> {h.time}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Dokumen Cetak PDF Format A4 Margin 3-3-3-3 */}
                    <div id="pdf-certificate-container" style={{display: 'none', width: '100%', backgroundColor: '#fff'}}>
                        <div id="pdf-certificate-content" style={{ padding: '0', width: '100%', fontFamily: '"Times New Roman", Times, serif', color: '#000000', backgroundColor: '#ffffff', textAlign: 'left' }}>
                            <div style={{ display: 'flex', alignItems: 'center', borderBottom: '3px double #000000', paddingBottom: '15px', marginBottom: '20px' }}>
                                <div style={{ width: '25mm', marginRight: '5mm', textAlign: 'center' }}>
                                    <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', width: '70px', height: '70px', margin: '0 auto' }}>
                                        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: '#00a0d2', borderRadius: '1rem', transform: 'rotate(3deg)', overflow: 'hidden', zIndex: 0 }}>
                                            <div style={{ position: 'absolute', width: '90px', height: '90px', backgroundColor: '#36bbe6', borderRadius: '50%', top: '-15px', left: '-15px' }}></div>
                                        </div>
                                        <img src="logo.png" alt="SITUNA Logo" style={{ position: 'absolute', width: '85px', height: '85px', objectFit: 'contain', zIndex: 10 }} onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                                    </div>
                                </div>
                                <div style={{ flex: 1, textAlign: 'left' }}>
                                    <h2 style={{ fontSize: '14pt', fontWeight: 'bold', margin: 0, textTransform: 'uppercase', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>BADAN KARANTINA INDONESIA</h2>
                                    <h3 style={{ fontSize: '14pt', fontWeight: 'bold', margin: '3px 0', textTransform: 'uppercase', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>SISTEM INFORMASI KETERTELUSURAN IKAN TUNA NASIONAL</h3>
                                </div>
                            </div>

                            <div style={{ textAlign: 'left', marginBottom: '20px' }}>
                                <h4 style={{ fontSize: '14pt', fontWeight: 'bold', textDecoration: 'underline', margin: 0, fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>HASIL TRACEABILITY &amp; UJI BARANTIN</h4>
                                <p style={{ fontSize: '12pt', margin: '5px 0 0 0', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>Nomor Seri Referensi Dokumen: <strong>{lot.id}</strong></p>
                            </div>

                            <p style={{ fontSize: '12pt', fontWeight: 'bold', margin: '15px 0 5px 0', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>1. TRACEABILITY (KETERTELUSURAN KAPAL - UPI)</p>
                            <table style={{ width: '100%', marginBottom: '15px', borderCollapse: 'collapse', fontSize: '12pt', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>
                                <tbody>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000', width: '35%' }}>Taksonomi Spesies Komoditas</td>
                                        <td style={{ padding: '6px', border: '1px solid #000', fontWeight: 'bold' }}>{lot.species}</td>
                                    </tr>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>Identitas Armada & Spesifikasi Alat</td>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>{lot.catchInfo?.kapal || '-'} ({lot.catchInfo?.alatTangkap || '-'})</td>
                                    </tr>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>Status Legalitas Dokumen SHTI</td>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>{lot.catchInfo?.doc ? 'Bebas Praktik IUU Fishing (Dokumen Terlampir)' : 'Memerlukan Verifikasi Lanjutan'}</td>
                                    </tr>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>Area Operasional & Stabilitas Suhu</td>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>{lot.catchInfo?.wpp || '-'} | Pengendalian Cold Chain: {lot.catchInfo?.temp || '-'} °C</td>
                                    </tr>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>Kalkulasi Akhir Pengukuran Biomassa</td>
                                        <td style={{ padding: '6px', border: '1px solid #000', fontWeight: 'bold' }}>{lot.weight} kg</td>
                                    </tr>
                                </tbody>
                            </table>

                            <p style={{ fontSize: '12pt', fontWeight: 'bold', margin: '15px 0 5px 0', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>2. UJI BARANTIN (MUTU LABORATORIUM)</p>
                            <table style={{ width: '100%', marginBottom: '25px', borderCollapse: 'collapse', fontSize: '12pt', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>
                                <tbody>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000', width: '35%' }}>Konsentrasi Histamin Terukur</td>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>{lot.labInfo?.histamine || '0'} ppm (Standar Ambang Batas &lt; 50 ppm)</td>
                                    </tr>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>Pemeriksaan Patogen & Parasitologi</td>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>{lot.labInfo?.parasit || 'Absensi Parasit'}</td>
                                    </tr>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>Kadar Cemaran Logam Berat (Pb / Hg)</td>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>{lot.labInfo?.metals || 'Kesesuaian Standar Keamanan'}</td>
                                    </tr>
                                    <tr>
                                        <td style={{ padding: '6px', border: '1px solid #000' }}>Ketetapan Sertifikat Kesehatan</td>
                                        <td style={{ padding: '6px', border: '1px solid #000', fontWeight: 'bold' }}>{lot.labInfo?.decision ? `${lot.labInfo.decision.toUpperCase()}` : 'MEMENUHI KELAYAKAN EKSPOR'}</td>
                                    </tr>
                                </tbody>
                            </table>

                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginTop: '30px', pageBreakInside: 'avoid' }}>
                                <div style={{ textAlign: 'center', width: '130px' }}>
                                    <canvas ref={pdfQrRef} style={{ width: '90px', height: '90px', border: '1px solid #000', padding: '2px' }}></canvas>
                                    <p style={{ fontSize: '10pt', margin: '3px 0 0 0', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>Kode Pemindai Validasi</p>
                                </div>
                                <div style={{ textAlign: 'left', width: '250px', fontSize: '12pt', fontFamily: '"Times New Roman", Times, serif', color: '#000' }}>
                                    <p style={{ margin: 0 }}>Ditetapkan di : Jakarta</p>
                                    <p style={{ margin: '2px 0 10px 0' }}>Pada Tanggal : {new Date().toLocaleDateString('id-ID', {day: '2-digit', month: 'long', year: 'numeric'})}</p>
                                    <p style={{ fontWeight: 'bold', margin: 0 }}>A.n. KEPALA BADAN KARANTINA INDONESIA</p>
                                    <p style={{ margin: '2px 0 45px 0' }}>Direktur Pengawasan &amp; Ketertelusuran,</p>
                                    <p style={{ fontWeight: 'bold', textDecoration: 'underline', margin: 0 }}>Dr. H. M. Fauzan, M.Si.</p>
                                    <p style={{ margin: 0 }}>NIP. 19780512 200501 1 003</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('splash'); 
            const [user, setUser] = useState(null);
            const [toast, setToast] = useState({ show: false, message: '', type: '' });
            const [activeLotId, setActiveLotId] = useState(null);
            
            const [lots, updateLots] = useSharedDatabase();

            const showToast = (message, type = 'info') => setToast({ show: true, message, type });

            const handleLogin = (u) => {
                setUser(u);
                setView('dashboard');
                showToast(`Otentikasi Kredensial Tervalidasi: ${u.name}`, 'success');
            };

            return (
                <div className="min-h-screen relative font-sans text-gray-800 selection:bg-situna-main selection:text-white">
                    <div className="bg-blobs"><div className="blob blob-1"></div><div className="blob blob-2"></div></div>
                    {toast.show && <Toast message={toast.message} type={toast.type} onClose={() => setToast({ show: false, message: '', type: '' })} />}
                    
                    {view === 'splash' && <SplashScreen onFinish={() => setView('login')} />}
                    {view === 'login' && <LoginScreen onLogin={handleLogin} />}
                    {view === 'dashboard' && user?.role === 'konsumen' && (
                        <ConsumerPortal lots={lots} onLogout={() => { setUser(null); setView('login'); }} showToast={showToast} />
                    )}
                    {view === 'dashboard' && user?.role !== 'konsumen' && !activeLotId && (
                        <Dashboard user={user} lots={lots} updateLots={updateLots} onViewDetail={id => setActiveLotId(id)} onLogout={() => { setUser(null); setView('login'); }} showToast={showToast} />
                    )}
                    {view === 'dashboard' && user?.role !== 'konsumen' && activeLotId && (
                        <LotDetail lotId={activeLotId} lots={lots} user={user} updateLots={updateLots} onBack={() => setActiveLotId(null)} showToast={showToast} />
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
