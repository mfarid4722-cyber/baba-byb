<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITUNA - Sistem Informasi Ketertelusuran Ikan Tuna Nasional</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- QRious Library untuk Bikin QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <!-- html5-qrcode Library untuk BACA QR Code dari Kamera Konsumen -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <!-- html2pdf Library untuk Export Sertifikat PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif']
                    },
                    colors: {
                        situna: { dark: '#0077b6', main: '#00b4d8', light: '#90e0ef', bg: '#caf0f8' }
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; background-color: #caf0f8; font-family: 'Inter', sans-serif; color: #1e293b; overflow-x: hidden; }
        h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
        
        /* Animasi Background Lautan Organik */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #caf0f8 100%); overflow: hidden; }
        .blob { position: absolute; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation: morph 15s ease-in-out infinite alternate; }
        .blob-1 { width: 600px; height: 600px; top: -100px; left: -200px; background: rgba(144, 224, 239, 0.4); }
        .blob-2 { width: 500px; height: 500px; bottom: -100px; right: -100px; background: rgba(255, 255, 255, 0.2); animation-delay: 2s; }
        @keyframes morph { 0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg) scale(1); } 100% { border-radius: 60% 40% 30% 70% / 60% 40% 50% 50%; transform: rotate(10deg) scale(1.1); } }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: floatSlow 4s ease-in-out infinite; }

        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 30px rgba(0, 119, 182, 0.15); }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(0, 180, 216, 0.5); border-radius: 10px; }
        .step-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; position: relative; z-index: 10; }
        
        #qr-reader { width: 100%; border: none !important; border-radius: 16px; overflow: hidden; }
        #qr-reader video { border-radius: 16px; object-fit: cover; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const generateID = () => `SITUNA-${Math.floor(100000 + Math.random() * 900000)}`;

        const usersDB = [
            { id: 'u1', username: 'admin', password: '123', role: 'admin', name: 'Administrator Pusat' },
            { id: 'u2', username: 'karantina', password: '123', role: 'karantina', name: 'Otoritas Karantina' },
            { id: 'u3', username: 'nelayan', password: '123', role: 'nelayan', name: 'Kapten Armada Penangkap' },
            { id: 'u4', username: 'pengolah', password: '123', role: 'pengolah', name: 'Fasilitas Pengolahan (UPI)' },
            { id: 'u5', username: 'konsumen', password: '123', role: 'konsumen', name: 'Akses Publik / Konsumen' }
        ];

        const STAGES = { 1: "Wilayah Perairan & Pelabuhan", 2: "Pemrosesan (UPI)", 3: "Inspeksi Klinis", 4: "Sertifikasi Kelayakan" };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, [onClose]);
            const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-situna-dark' };
            return (
                <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-[100] ${colors[type]} text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 fade-in font-medium tracking-wide`}>
                    <i className={`fas ${type === 'success' ? 'fa-check' : type === 'error' ? 'fa-times' : 'fa-info-circle'}`}></i> {message}
                </div>
            );
        };

        const useSharedDatabase = () => {
            const [lots, setLots] = useState(() => {
                const saved = localStorage.getItem('situna_db_formal_v1');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 'SITUNA-892104', stage: 4, type: 'source', parents: [],
                        species: 'Thunnus albacares (Yellowfin Tuna Premium)', weight: 145.5,
                        catchInfo: { wpp: 'WPP-714 (Koordinat: 4°35\'S 129°50\'E)', temp: '-20.5', doc: 'SHTI_2026.pdf', kapal: 'KM Samudra 01', alatTangkap: 'Rawai (Longline)' },
                        axisA: 'memadai', axisB: 'tidak_terindikasi', axisC: 'memenuhi_standar',
                        handover: { status: 'Diterima', sender: 'Otoritas Pelabuhan Perikanan', receiver: 'PT Pengolah Tuna Nusantara', senderW: 145.5, receiverW: 145.5 },
                        processInfo: { product: 120, byproduct: 20, shrink: 5.5, diff: 0, original: 145.5 },
                        labInfo: { histamine: '12.4', parasit: 'Absensi Parasit', metals: 'Aman (<0.01 ppm)', decision: 'Lulus Uji Klinis' },
                        tempGap: false, creator: 'Kapten Armada', createdAt: '18/10/2026, 08:30:15',
                        history: [
                            { time: '18/10/2026, 08:30:15', actor: 'Kapten Armada', action: 'Penangkapan di Wilayah Perairan. Inventarisasi data dimulai seketika saat ikan ditangkap. Koordinat geografis direkam. Identitas armada: KM Samudra 01. Label fisik (tag) diaplikasikan sebagai basis data primer.' },
                            { time: '19/10/2026, 14:10:00', actor: 'Otoritas Pelabuhan', action: 'Pendaratan di Pelabuhan Perikanan. Hasil tangkapan diverifikasi oleh petugas Syahbandar. Pengukuran biomassa dan pemantauan suhu palka (-20.5°C) dilakukan. Sertifikat Hasil Tangkapan Ikan (SHTI) diterbitkan sebagai validasi bebas praktik IUU Fishing.' },
                            { time: '20/10/2026, 10:00:00', actor: 'Fasilitas Pengolahan (UPI)', action: 'Pemrosesan pada Unit Pengolahan Ikan. Komoditas didistribusikan untuk seleksi mutu (grading) dan reduksi ukuran. Pengendalian sistem rantai dingin (cold chain) diaplikasikan secara ketat guna mencegah degradasi kualitas daging.' },
                            { time: '21/10/2026, 09:15:00', actor: 'Badan Karantina Indonesia', action: 'Inspeksi Karantina dan Sertifikasi Mutu. Pengujian klinis dilaksanakan. Memverifikasi absensi patogen, parasit, dan cemaran logam berat. Sertifikat Kesehatan (Health Certificate) diterbitkan sebagai prasyarat administratif ekspor.' }
                        ]
                    }
                ];
            });
            const channel = useMemo(() => new BroadcastChannel('situna_sync_formal_v1'), []);

            useEffect(() => {
                channel.onmessage = (event) => {
                    if (event.data.type === 'SYNC') {
                        setLots(event.data.payload);
                        localStorage.setItem('situna_db_formal_v1', JSON.stringify(event.data.payload));
                    }
                };
                return () => channel.close();
            }, [channel]);

            const updateDB = (newLots) => {
                setLots(newLots);
                localStorage.setItem('situna_db_formal_v1', JSON.stringify(newLots));
                channel.postMessage({ type: 'SYNC', payload: newLots });
            };
            return [lots, updateDB];
        };

        const Badge = ({ label, color }) => (
            <span className={`inline-flex items-center px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider ${color}`}>{label}</span>
        );

        const SplashScreen = ({ onFinish }) => {
            useEffect(() => {
                const timer = setTimeout(onFinish, 2500);
                return () => clearTimeout(timer);
            }, [onFinish]);

            return (
                <div className="flex flex-col items-center justify-center min-h-screen text-white fade-in relative z-10">
                    <div className="mb-6 transform transition hover:scale-105 flex justify-center">
                        <img src="logo.png" alt="Logo" className="w-[120px] h-[120px] object-contain drop-shadow-[0_0_25px_rgba(0,0,0,0.6)] animate-float" onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                    </div>
                    <div className="absolute bottom-10 flex flex-col items-center">
                        <div className="w-10 h-10 border-4 border-t-white border-white/20 rounded-full animate-spin mb-4"></div>
                        <p className="text-sm font-bold tracking-wider opacity-90 drop-shadow text-center leading-tight">
                            BADAN KARANTINA INDONESIA<br/>2026
                        </p>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const u = usersDB.find(x => x.username === username && x.password === password);
                if (u) onLogin(u); else setError('Identitas atau kata sandi tidak valid.');
            };

            const quickLogin = (uname) => {
                const u = usersDB.find(x => x.username === uname);
                if (u) onLogin(u);
            };

            return (
                <div className="flex items-center justify-center min-h-screen z-10 relative px-4 py-8">
                    <div className="glass-card p-8 md:p-10 rounded-3xl w-full max-w-md fade-in relative overflow-hidden shadow-2xl">
                        <div className="text-center mb-6">
                            <div className="flex justify-center mb-4 mt-2">
                                <div className="relative flex items-center justify-center w-[120px] h-[120px]">
                                    <div className="absolute inset-0 bg-[#00a0d2] rounded-[1.5rem] rotate-3 overflow-hidden shadow-md z-0">
                                        <div className="absolute w-[140px] h-[140px] bg-[#36bbe6] rounded-full -top-6 -left-6"></div>
                                    </div>
                                    <img src="logo.png" alt="SITUNA Logo" className="absolute max-w-none w-[150px] h-[150px] object-contain z-10 drop-shadow-[0_0_10px_rgba(0,0,0,0.3)]" onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                                </div>
                            </div>
                            <h2 className="text-3xl font-display font-bold text-situna-dark mt-4">SITUNA</h2>
                            <p className="text-xs text-gray-500 mt-1">Sistem Informasi Ketertelusuran Ikan Tuna Nasional</p>
                        </div>
                        {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100 flex items-center gap-2"><i className="fas fa-exclamation-circle"></i> {error}</div>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="text" required value={username} onChange={e => setUsername(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-situna-main text-sm" placeholder="Identitas Pengguna (Contoh: nelayan / admin)" />
                            <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-situna-main text-sm" placeholder="Kata Sandi Kredensial" />
                            <button type="submit" className="w-full bg-situna-dark hover:bg-situna-main text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-2">Otentikasi Kredensial</button>
                        </form>

                        <div className="mt-8 pt-6 border-t border-gray-200">
                            <p className="text-[11px] font-bold text-gray-400 uppercase tracking-wider text-center mb-3">Akses Informasi Publik Terbuka:</p>
                            <button onClick={() => quickLogin('konsumen')} className="w-full bg-gradient-to-r from-blue-600 to-situna-dark hover:from-blue-700 hover:to-blue-900 text-white font-bold py-3.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-3 shadow-lg transform hover:-translate-y-0.5">
                                <i className="fas fa-qrcode text-lg"></i> Verifikasi Dokumen Ketertelusuran
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ConsumerPortal = ({ lots, onLogout, showToast }) => {
            const [searchId, setSearchId] = useState('');
            const [scannedLot, setScannedLot] = useState(null);
            const [isScanning, setIsScanning] = useState(false);
            
            const consumerQrRef = useRef(null);
            const scannerInst = useRef(null);

            useEffect(() => {
                if (scannedLot && consumerQrRef.current && window.QRious) {
                    new QRious({ element: consumerQrRef.current, value: `https://situna.go.id/verify/${scannedLot.id}`, size: 140, background: 'white', foreground: '#0077b6' });
                }
            }, [scannedLot]);

            useEffect(() => {
                if (isScanning && window.Html5Qrcode) {
                    scannerInst.current = new Html5Qrcode("qr-reader");
                    const qrCodeSuccessCallback = (decodedText) => {
                        if (scannerInst.current) {
                            scannerInst.current.stop().then(() => {
                                setIsScanning(false);
                                let finalId = decodedText;
                                if (finalId.includes('/verify/')) finalId = finalId.split('/verify/').pop();
                                setSearchId(finalId);
                                handleScanDirect(finalId);
                            }).catch(err => console.error("Error menghentikan perangkat pemindai", err));
                        }
                    };
                    scannerInst.current.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, qrCodeSuccessCallback)
                    .catch((err) => {
                        setIsScanning(false);
                        showToast("Gagal mengakses perangkat kamera. Mohon verifikasi perizinan akses.", "error");
                    });
                }
                return () => {
                    if (scannerInst.current && scannerInst.current.isScanning) {
                        scannerInst.current.stop().catch(err => console.error("Error pelepasan komponen", err));
                    }
                };
            }, [isScanning]);

            const handleScanDirect = (idToSearch) => {
                const found = lots.find(l => l.id.toLowerCase() === idToSearch.toLowerCase());
                if (found) {
                    setScannedLot(found);
                    showToast(`Dokumen Identifikasi ${found.id} berhasil dimuat.`, 'success');
                } else {
                    setScannedLot(null);
                    showToast('Dokumen Identifikasi Komoditas tidak teregistrasi dalam sistem nasional.', 'error');
                }
            };

            const handleScanForm = (e) => {
                e.preventDefault();
                if (!searchId.trim()) return;
                handleScanDirect(searchId.trim());
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-4xl mx-auto fade-in pb-24">
                    <header className="glass-card p-6 rounded-3xl mb-8 flex justify-between items-center shadow-md">
                        <div className="flex items-center gap-4">
                            <div className="relative flex items-center justify-center shrink-0 w-[55px] h-[55px]">
                                <div className="absolute inset-0 bg-[#00a0d2] rounded-[1rem] -rotate-3 overflow-hidden shadow-md z-0">
                                    <div className="absolute w-[80px] h-[80px] bg-[#36bbe6] rounded-full -top-4 -left-6"></div>
                                </div>
                                <img src="logo.png" alt="BKN Logo" className="absolute max-w-none w-[100px] h-[100px] object-contain z-10 drop-shadow-[0_0_8px_rgba(0,0,0,0.3)]" onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                            </div>
                            <div>
                                <h1 className="text-lg md:text-xl font-display font-bold text-situna-dark leading-tight">PORTAL PUBLIK SITUNA</h1>
                                <p className="text-[10px] md:text-xs text-gray-500 font-bold tracking-wide mt-0.5">VERIFIKASI KETERTELUSURAN KOMODITAS</p>
                            </div>
                        </div>
                        <button onClick={onLogout} className="bg-red-50 hover:bg-red-500 text-red-500 hover:text-white px-4 py-2.5 rounded-xl transition text-xs font-bold flex items-center gap-2">
                            <i className="fas fa-sign-out-alt"></i> <span className="hidden sm:inline">Keluar Sistem</span>
                        </button>
                    </header>

                    <div className="glass-card p-6 rounded-3xl mb-8 shadow-lg bg-gradient-to-br from-white/95 to-blue-50/50">
                        <h3 className="text-base font-bold text-gray-800 mb-2 flex items-center gap-2">
                            <i className="fas fa-qrcode text-situna-main"></i> Masukkan atau Pindai Nomor Identifikasi
                        </h3>
                        <p className="text-xs text-gray-500 mb-4">Setiap komoditas bersertifikat memiliki nomor identitas unik (Contoh: SITUNA-123456) guna menjamin keabsahan dan kelayakan konsumsi.</p>
                        
                        {isScanning ? (
                            <div className="bg-gray-900 rounded-2xl p-4 flex flex-col items-center mb-4 fade-in">
                                <div id="qr-reader" className="w-full max-w-sm mb-4 bg-black rounded-2xl shadow-inner border-2 border-dashed border-gray-600"></div>
                                <button onClick={() => setIsScanning(false)} className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl font-bold transition flex items-center gap-2 text-sm">
                                    <i className="fas fa-times"></i> Tutup Perangkat Pemindai
                                </button>
                                <p className="text-[10px] text-gray-400 mt-2 text-center">Fokuskan lensa pada Kode QR yang tertera di kemasan.</p>
                            </div>
                        ) : (
                            <form onSubmit={handleScanForm} className="flex flex-col sm:flex-row gap-3">
                                <div className="relative flex-1">
                                    <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    <input type="text" required value={searchId} onChange={e => setSearchId(e.target.value)} placeholder="Contoh Referensi: SITUNA-..." className="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white border border-gray-200 focus:outline-none focus:ring-2 focus:ring-situna-main font-mono text-sm shadow-sm font-bold" />
                                </div>
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 bg-situna-dark hover:bg-situna-main text-white px-6 py-3.5 rounded-2xl font-bold transition shadow-lg flex items-center justify-center gap-2">
                                        Telusuri Komoditas
                                    </button>
                                    <button type="button" onClick={() => setIsScanning(true)} className="flex-1 sm:flex-none bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3.5 rounded-2xl font-bold transition shadow-lg flex items-center justify-center gap-2">
                                        <i className="fas fa-camera"></i> <span className="sm:hidden">Pindai</span>
                                    </button>
                                </div>
                            </form>
                        )}

                        {lots.length > 0 && !isScanning && (
                            <div className="mt-5 pt-4 border-t border-gray-100 flex flex-wrap items-center gap-2">
                                <span className="text-[11px] font-bold text-gray-400 uppercase">Dokumen Tersedia di Sistem:</span>
                                {lots.map(l => (
                                    <button key={l.id} onClick={() => handleScanDirect(l.id)} className="text-xs px-3 py-1.5 rounded-lg font-mono font-bold transition border bg-white text-gray-700 border-gray-200 hover:border-situna-main hover:bg-blue-50">
                                        {l.id}
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    {scannedLot ? (
                        <div className="space-y-6 fade-in">
                            <div className="glass-card p-6 md:p-8 rounded-3xl shadow-xl relative overflow-hidden border-t-8 border-t-situna-main">
                                <div className="absolute top-0 right-0 w-64 h-64 bg-blue-400/10 rounded-full blur-3xl pointer-events-none -mr-20 -mt-20"></div>
                                
                                <div className="flex flex-col md:flex-row gap-6 items-center md:items-start justify-between border-b border-gray-100 pb-6 mb-6">
                                    <div className="flex flex-col sm:flex-row gap-5 items-center sm:items-start text-center sm:text-left">
                                        <div className="bg-white p-3 rounded-2xl border shadow-sm shrink-0 transform transition hover:scale-105">
                                            <canvas ref={consumerQrRef} className="w-[120px] h-[120px]"></canvas>
                                        </div>
                                        <div>
                                            <div className="flex items-center justify-center sm:justify-start gap-2 mb-2">
                                                <Badge label={STAGES[scannedLot.stage]} color={scannedLot.stage === 4 ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'} />
                                                <span className="text-xs font-mono font-bold text-gray-400">| {scannedLot.id}</span>
                                            </div>
                                            <h2 className="text-xl md:text-2xl font-bold text-gray-800 leading-snug">{scannedLot.species}</h2>
                                            <p className="text-xs text-gray-500 mt-1"><i className="fas fa-calendar-alt text-situna-main mr-1"></i> Tanggal Registrasi: {scannedLot.createdAt}</p>
                                        </div>
                                    </div>

                                    <div className="bg-blue-50/80 border border-blue-100 p-4 rounded-2xl text-center md:text-right shrink-0 w-full sm:w-auto">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase">Pengukuran Biomassa Aktual</p>
                                        <p className="text-3xl font-black text-situna-dark mt-0.5">{scannedLot.weight} <span className="text-sm font-medium">kg</span></p>
                                        <p className="text-[11px] text-emerald-600 font-bold mt-1"><i className="fas fa-check-circle"></i> Tervalidasi Legal &amp; Lestari</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
                                    <div className="bg-white/80 border border-gray-100 p-4 rounded-2xl shadow-sm">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase mb-1"><i className="fas fa-map-marker-alt text-situna-main mr-1"></i> Area Operasional</p>
                                        <p className="font-bold text-sm text-gray-800">{scannedLot.catchInfo?.wpp}</p>
                                    </div>
                                    <div className="bg-white/80 border border-gray-100 p-4 rounded-2xl shadow-sm">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase mb-1"><i className="fas fa-thermometer-half text-situna-main mr-1"></i> Pengendalian Suhu (Cold Chain)</p>
                                        <p className="font-bold text-sm text-gray-800">{scannedLot.catchInfo?.temp} °C (Kondisi Optimal)</p>
                                    </div>
                                    <div className="bg-white/80 border border-gray-100 p-4 rounded-2xl shadow-sm">
                                        <p className="text-[10px] font-bold text-gray-400 uppercase mb-1"><i className="fas fa-shield-alt text-situna-main mr-1"></i> Hasil Pengujian Karantina</p>
                                        <p className="font-bold text-sm text-green-600 uppercase">{scannedLot.axisC === 'memenuhi_standar' ? 'Memenuhi Kelayakan Ekspor' : scannedLot.axisC}</p>
                                    </div>
                                </div>

                                <div className="bg-gradient-to-r from-blue-900 to-situna-dark text-white p-6 rounded-2xl shadow-md mb-8">
                                    <h4 className="text-sm font-bold uppercase tracking-wider mb-4 flex items-center gap-2 text-situna-light">
                                        <i className="fas fa-microscope"></i> Parameter Mutu &amp; Keamanan Konsumsi
                                    </h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                                        <div className="bg-white/10 p-3 rounded-xl backdrop-blur">
                                            <p className="opacity-75 mb-1">Konsentrasi Histamin</p>
                                            <p className="text-base font-bold text-white">{scannedLot.labInfo?.histamine || '0'} ppm <span className="text-[10px] font-normal opacity-80">(Batas Toleransi &lt; 50 ppm)</span></p>
                                        </div>
                                        <div className="bg-white/10 p-3 rounded-xl backdrop-blur">
                                            <p className="opacity-75 mb-1">Pemeriksaan Parasitologi</p>
                                            <p className="text-base font-bold text-emerald-400">{scannedLot.labInfo?.parasit || 'Absensi Parasit'}</p>
                                        </div>
                                        <div className="bg-white/10 p-3 rounded-xl backdrop-blur">
                                            <p className="opacity-75 mb-1">Kadar Cemaran Logam (Pb/Hg)</p>
                                            <p className="text-base font-bold text-emerald-400">{scannedLot.labInfo?.metals || 'Sesuai Standar Baku Mutu'}</p>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <h4 className="text-sm font-bold text-gray-800 uppercase tracking-wider mb-6 flex items-center gap-2">
                                        <i className="fas fa-route text-situna-main"></i> Rekam Jejak Rantai Distribusi Komoditas
                                    </h4>
                                    <div className="relative border-l-2 border-situna-main/30 ml-4 space-y-6 pb-2">
                                        {scannedLot.history.map((h, i) => (
                                            <div key={i} className="relative pl-6">
                                                <div className="absolute w-4 h-4 bg-situna-main rounded-full -left-[9px] top-0 border-4 border-white shadow"></div>
                                                <div className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className="text-xs font-bold text-situna-dark"><i className="fas fa-check-circle text-situna-main mr-1"></i> {h.actor}</span>
                                                        <span className="text-[10px] text-gray-400 font-mono">{h.time}</span>
                                                    </div>
                                                    <p className="text-xs text-gray-700 leading-relaxed font-medium">{h.action}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="glass-card rounded-3xl p-12 text-center flex flex-col items-center justify-center min-h-[400px] fade-in border-dashed border-2 border-blue-200">
                            <div className="w-24 h-24 bg-blue-50 text-situna-main rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner animate-pulse">
                                <i className="fas fa-qrcode"></i>
                            </div>
                            <h3 className="text-xl font-display font-bold text-gray-800 mb-3">Menunggu Instruksi Pemindaian</h3>
                            <p className="text-gray-500 text-sm max-w-md mx-auto leading-relaxed">
                                Silakan masukkan Nomor Identifikasi Lot pada instrumen pencarian atau gunakan perangkat pemindai untuk mengakses data ketertelusuran komoditas.
                            </p>
                        </div>
                    )}
                </div>
            );
        };

        const Dashboard = ({ user, lots, updateLots, onLogout, showToast, onViewDetail }) => {
            const [showCreateModal, setShowCreateModal] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [resetConfirm, setResetConfirm] = useState(false);
            const [form, setForm] = useState({ species: 'Thunnus albacares', weight: '', wpp: '', temp: '', docName: '', kapal: '', alatTangkap: 'Rawai (Longline)' });

            const handleCreate = (e) => {
                e.preventDefault();
                const newLot = {
                    id: generateID(), stage: 1, type: 'source', parents: [],
                    species: form.species, weight: parseFloat(form.weight),
                    catchInfo: { wpp: form.wpp, temp: form.temp, doc: form.docName || 'SHTI.pdf', kapal: form.kapal, alatTangkap: form.alatTangkap },
                    axisA: 'memadai', axisB: 'tidak_terindikasi', axisC: 'menunggu_inspeksi',
                    handover: { status: 'Di Pelabuhan', sender: user.name, receiver: null, senderW: parseFloat(form.weight), receiverW: null },
                    processInfo: null, labInfo: null, tempGap: false,
                    creator: user.name, createdAt: new Date().toLocaleString('id-ID'),
                    history: [{ time: new Date().toLocaleString('id-ID'), actor: user.name, action: `Penangkapan di Wilayah Perairan. Inventarisasi data primer dimulai. Armada: ${form.kapal}. Spesifikasi alat tangkap: ${form.alatTangkap}. Koordinat geografis operasi: ${form.wpp}. Dokumen SHTI dilampirkan sebagai validasi legalitas.` }]
                };
                updateLots([newLot, ...lots]);
                setShowCreateModal(false);
                setForm({ species: 'Thunnus albacares', weight: '', wpp: '', temp: '', docName: '', kapal: '', alatTangkap: 'Rawai (Longline)' });
                showToast(`Inventarisasi Data Primer untuk ID ${newLot.id} berhasil direkam ke dalam sistem.`, 'success');
            };

            const handleDelete = (id) => {
                updateLots(lots.filter(l => l.id !== id));
                setDeleteConfirm(null);
                showToast(`Seluruh data rekam jejak untuk identitas ${id} telah ditiadakan dari sistem secara permanen.`, 'success');
            };

            const handleReset = () => {
                updateLots([]);
                setResetConfirm(false);
                showToast('Seluruh pangkalan data telah diatur ulang (Reset).', 'success');
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto fade-in pb-20">
                    <header className="glass-card p-6 rounded-3xl mb-8 flex justify-between items-center shadow-md relative overflow-hidden">
                        <div className="flex items-center gap-4 md:gap-5 z-10 relative">
                            <div className="relative flex items-center justify-center w-[70px] h-[70px]">
                                <div className="absolute inset-0 bg-[#00a0d2] rounded-[1rem] rotate-3 overflow-hidden shadow-md z-0">
                                    <div className="absolute w-[100px] h-[100px] bg-[#36bbe6] rounded-full -top-4 -left-6"></div>
                                </div>
                                <img src="logo.png" alt="BKN Logo" className="absolute max-w-none w-[120px] h-[120px] object-contain z-10 drop-shadow-[0_0_8px_rgba(0,0,0,0.4)]" onError={(e) => { e.target.onerror = null; e.src = './logo.png'; }} />
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-display font-bold text-situna-dark leading-tight">BADAN KARANTINA INDONESIA</h1>
                                <p className="text-[10px] md:text-xs text-gray-500 font-bold tracking-wide mt-0.5">SISTEM INFORMASI KETERTELUSURAN IKAN TUNA NASIONAL</p>
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-3 bg-white/70 p-2 pl-4 rounded-2xl border border-white shrink-0 z-10 relative">
                            <div className="text-right hidden sm:block pr-2 border-r border-gray-200">
                                <p className="text-sm font-bold text-gray-800">{user.name}</p>
                                <p className="text-[10px] font-bold text-situna-main uppercase tracking-wider">{user.role}</p>
                            </div>
                            <button onClick={onLogout} className="bg-red-50 hover:bg-red-500 text-red-500 hover:text-white w-10 h-10 rounded-xl transition flex items-center justify-center ml-1" title="Keluar Sistem"><i className="fas fa-power-off"></i></button>
                        </div>
                    </header>

                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <h2 className="text-xl font-bold text-gray-800">Inventaris Dokumen Ketertelusuran</h2>
                        <div className="flex flex-wrap gap-2 w-full sm:w-auto">
                            {user.role === 'admin' && lots.length > 0 && (
                                <button onClick={() => setResetConfirm(true)} className="flex-1 sm:flex-none bg-white border border-red-200 hover:bg-red-50 text-red-500 px-4 py-2.5 rounded-xl font-bold transition shadow-sm flex items-center justify-center gap-2 text-sm">
                                    <i className="fas fa-trash-alt"></i> <span>Atur Ulang Data (Reset)</span>
                                </button>
                            )}
                            {(user.role === 'nelayan' || user.role === 'admin') && (
                                <button onClick={() => setShowCreateModal(true)} className="flex-1 sm:flex-none bg-situna-dark hover:bg-situna-main text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg flex items-center justify-center gap-2">
                                    <i className="fas fa-plus"></i> <span>Registrasi Hasil Tangkapan</span>
                                </button>
                            )}
                        </div>
                    </div>

                    {lots.length === 0 ? (
                        <div className="glass-card rounded-3xl p-12 text-center border-dashed border-2 border-gray-300">
                            <div className="w-20 h-20 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"><i className="fas fa-ship"></i></div>
                            <h3 className="text-xl font-bold text-gray-700 mb-2">Pangkalan Data Ekspedisi Kosong</h3>
                            <p className="text-gray-500 text-sm">Silakan lakukan otentikasi sebagai Kapten Armada untuk memulai inisiasi pendataan primer.</p>
                        </div>
                    ) : (
                        <div className="glass-card rounded-3xl overflow-hidden shadow-lg">
                            <table className="w-full text-left">
                                <thead className="bg-gray-50 border-b border-gray-100">
                                    <tr className="text-xs text-gray-400 uppercase font-bold">
                                        <th className="p-5">Nomor Identifikasi</th>
                                        <th className="p-5">Taksonomi Spesies</th>
                                        <th className="p-5">Fase Pemrosesan & Biomassa</th>
                                        <th className="p-5 text-right">Tindakan Lanjutan</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {lots.map(lot => (
                                        <tr key={lot.id} className="hover:bg-blue-50/30 transition">
                                            <td className="p-5">
                                                <div className="font-bold text-situna-dark text-sm">{lot.id}</div>
                                                <div className="text-[10px] text-gray-400 mt-1">{lot.createdAt}</div>
                                            </td>
                                            <td className="p-5">
                                                <div className="font-bold text-gray-800 text-sm">{lot.species}</div>
                                                <div className="text-xs text-gray-500 mt-0.5">{lot.catchInfo?.wpp || '-'}</div>
                                            </td>
                                            <td className="p-5">
                                                <Badge label={STAGES[lot.stage]} color={lot.stage === 4 ? 'bg-green-100 text-green-700' : lot.stage === 3 ? 'bg-yellow-100 text-yellow-700' : 'bg-blue-100 text-blue-700'} />
                                                <div className="text-xs font-bold text-gray-600 mt-1">{lot.weight} kg</div>
                                            </td>
                                            <td className="p-5">
                                                <div className="flex items-center justify-end gap-2">
                                                    {user.role === 'admin' && (
                                                        <button onClick={() => setDeleteConfirm(lot.id)} className="bg-white border border-red-200 hover:bg-red-50 text-red-500 px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm" title="Hapus Dokumen">
                                                            <i className="fas fa-trash"></i>
                                                        </button>
                                                    )}
                                                    <button onClick={() => onViewDetail(lot.id)} className="bg-white border border-gray-200 hover:border-situna-main text-situna-dark px-4 py-2 rounded-xl text-xs font-bold transition shadow-sm">Evaluasi Terpadu</button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {showCreateModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl overflow-y-auto max-h-[90vh]">
                                <h3 className="text-xl font-bold text-gray-800 mb-2 flex items-center gap-3"><i className="fas fa-anchor text-situna-dark"></i> Formulir Registrasi Tangkapan</h3>
                                <p className="text-xs text-gray-500 mb-6">Perekaman basis data primer. Diwajibkan melengkapi koordinat navigasi, spesifikasi armada, dan otorisasi SHTI.</p>
                                
                                <form onSubmit={handleCreate} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Taksonomi Spesies</label><select value={form.species} onChange={e=>setForm({...form, species: e.target.value})} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm"><option value="Thunnus albacares (Yellowfin)">Yellowfin Tuna</option><option value="Thunnus obesus (Bigeye)">Bigeye Tuna</option></select></div>
                                        <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Identitas Armada Kapal</label><input required type="text" value={form.kapal} onChange={e=>setForm({...form, kapal: e.target.value})} placeholder="Contoh: KM Samudra 01" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm" /></div>
                                        <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Spesifikasi Alat Tangkap</label><select value={form.alatTangkap} onChange={e=>setForm({...form, alatTangkap: e.target.value})} className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm"><option value="Rawai (Longline)">Rawai (Longline)</option><option value="Pancing Ulur (Handline)">Pancing Ulur (Handline)</option><option value="Pukat Cincin (Purse Seine)">Pukat Cincin (Purse Seine)</option></select></div>
                                        <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Koordinat Geografis Operasi</label><input required type="text" value={form.wpp} onChange={e=>setForm({...form, wpp: e.target.value})} placeholder="Contoh: WPP 714" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm" /></div>
                                        <div><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Suhu Sistem Penyimpanan (°C)</label><input required type="number" step="0.1" value={form.temp} onChange={e=>setForm({...form, temp: e.target.value})} placeholder="-20" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 text-sm" /></div>
                                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Pengukuran Biomassa (kg)</label><input required type="number" step="0.1" value={form.weight} onChange={e=>setForm({...form, weight: e.target.value})} placeholder="Biomassa diidentifikasi saat bersandar" className="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 font-bold text-lg" /></div>
                                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 uppercase mb-2">Lampiran Otentikasi (SHTI)</label><div className="border-2 border-dashed border-gray-300 rounded-xl p-4 bg-gray-50"><input type="file" onChange={e => setForm({...form, docName: e.target.files[0]?.name})} className="text-xs text-gray-500 w-full" accept=".pdf,image/*" /></div></div>
                                    </div>
                                    <div className="flex gap-3 pt-4 border-t border-gray-100">
                                        <button type="button" onClick={() => setShowCreateModal(false)} className="flex-1 py-3 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition">Batalkan</button>
                                        <button type="submit" className="flex-1 py-3 rounded-xl font-bold text-white bg-situna-dark hover:bg-situna-main transition shadow-md">Simpan Rekam Jejak Primer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {deleteConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"><i className="fas fa-trash"></i></div>
                                <h3 className="text-xl font-bold text-gray-800 mb-2">Otorisasi Penghapusan Dokumen</h3>
                                <p className="text-xs text-gray-500 mb-6">Informasi ketertelusuran untuk referensi <strong>{deleteConfirm}</strong> akan direduksi dari sistem secara permanen.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition">Batalkan</button>
                                    <button onClick={() => handleDelete(deleteConfirm)} className="flex-1 py-3 rounded-xl font-bold text-white bg-red-500 hover:bg-red-600 transition shadow-md">Konfirmasi Penghapusan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {resetConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 fade-in">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"><i className="fas fa-exclamation-triangle"></i></div>
                                <h3 className="text-xl font-bold text-red-600 mb-2">Konfirmasi Pengaturan Ulang Pangkalan Data</h3>
                                <p className="text-xs text-gray-500 mb-6">Tindakan ini akan mengeliminasi seluruh rekaman informasi dari arsitektur sistem. Apakah Anda akan melanjutkan?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setResetConfirm(false)} className="flex-1 py-3 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition">Batalkan</button>
                                    <button onClick={handleReset} className="flex-1 py-3 rounded-xl font-bold text-white bg-red-600 hover:bg-red-700 transition shadow-md">Lanjutkan Proses Reset</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const LotDetail = ({ lotId, lots, user, onBack, updateLots, showToast }) => {
            const lot = lots.find(l => l.id === lotId);
            const [tab, setTab] = useState('Inspeksi & Uji Klinis');

            const qrRef = useRef(null);
            const pdfQrRef = useRef(null);
            const [serahForm, setSerahForm] = useState({ rWeight: '' });
            const [neracaForm, setNeracaForm] = useState({ prod: '', byprod: '', shrink: '' });
            const [pecahForm, setPecahForm] = useState({ w1: '', w2: '' });
            const [labForm, setLabForm] = useState({ histamine: '', parasit: 'Absensi Parasit', metals: 'Kesesuaian Standar Aman' });
            const [koreksiForm, setKoreksiForm] = useState({ field: 'Biomassa', oldVal: lot?.weight || '', newVal: '', reason: '' });

            useEffect(() => {
                if (qrRef.current && window.QRious) new QRious({ element: qrRef.current, value: `https://situna.go.id/verify/${lot.id}`, size: 130, background: 'white', foreground: '#0f172a' });
                if (pdfQrRef.current && window.QRious) new QRious({ element: pdfQrRef.current, value: `https://situna.go.id/verify/${lot.id}`, size: 90, background: 'white', foreground: '#000000' });
            }, [lot]);

            if (!lot) return null;

            const handleKirim = () => {
                const updated = { ...lot, handover: { ...lot.handover, status: 'Menunggu Penerima' }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Komoditas didistribusikan ke fasilitas Unit Pengolahan Ikan (UPI). Dalam proses pemantauan administrasi lanjutan.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Instruksi distribusi komoditas diterbitkan.", "info");
            };
            const handleTerima = (e) => {
                e.preventDefault(); const rW = parseFloat(serahForm.rWeight);
                const updated = { ...lot, axisA: rW !== lot.handover.senderW ? 'deviasi_terdeteksi' : lot.axisA, handover: { ...lot.handover, status: 'Diterima', receiver: user.name, receiverW: rW }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Penerimaan logistik pada Fasilitas Pengolahan terverifikasi. Pengendalian sistem rantai dingin dipertahankan. Volume biomassa: ${rW}kg.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Konfirmasi penerimaan berhasil dicatat ke pangkalan data.", "success");
            };
            const handleNeraca = (e) => {
                e.preventDefault(); const p = parseFloat(neracaForm.prod); const b = parseFloat(neracaForm.byprod); const s = parseFloat(neracaForm.shrink);
                const total = p + b + s; const diff = Math.abs(lot.weight - total);
                const updated = { ...lot, weight: p, stage: 2, axisA: diff > (lot.weight * 0.01) ? 'deviasi_signifikan' : lot.axisA, processInfo: { product: p, byproduct: b, shrink: s, diff, original: lot.weight }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Eksekusi reduksi ukuran (pemotongan loin). Rasio In: ${lot.weight}, Rasio Out: ${total}. Deviasi kalkulasi tercatat sebesar: ${diff.toFixed(2)}kg.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Parameter neraca massa terverifikasi secara sistematis.", "success");
            };
            const handlePecah = (e) => {
                e.preventDefault(); const w1 = parseFloat(pecahForm.w1); const w2 = parseFloat(pecahForm.w2);
                if (w1 + w2 > lot.weight) { showToast("Penolakan Sistem: Kalkulasi melebihi alokasi biomassa primer.", "error"); return; }
                const base = { type: 'split', parents: [lot.id], stage: lot.stage, catchInfo: lot.catchInfo, processInfo: lot.processInfo, axisA: lot.axisA, axisB: lot.axisB, axisC: lot.axisC, handover: lot.handover, tempGap: lot.tempGap, creator: user.name, createdAt: new Date().toLocaleString() };
                const c1 = { ...base, id: generateID(), species: `${lot.species} (Kode Produksi B1)`, weight: w1, history: [{ time: new Date().toLocaleString(), actor: user.name, action: `Alokasi produk turunan (batch) dari referensi induk ${lot.id}.`}] };
                const c2 = { ...base, id: generateID(), species: `${lot.species} (Kode Produksi B2)`, weight: w2, history: [{ time: new Date().toLocaleString(), actor: user.name, action: `Alokasi produk turunan (batch) dari referensi induk ${lot.id}.`}] };
                const upInduk = { ...lot, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Restrukturisasi kode produksi menjadi identitas ${c1.id} & ${c2.id}.`}] };
                updateLots([c1, c2, upInduk, ...lots.filter(l => l.id !== lot.id)]); showToast("Penyesuaian kode produksi berhasil direkam.", "success");
            };
            const handleLabTest = (e, decision) => {
                e.preventDefault(); const newStage = decision === 'Memenuhi Kelayakan Ekspor' ? 4 : 3;
                const updated = { ...lot, stage: newStage, axisC: decision.toLowerCase(), labInfo: { ...labForm, decision }, history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Pelaksanaan Inspeksi Klinis Karantina. Ketetapan Resmi: ${decision}.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast(`Status Kelayakan Uji Klinis: ${decision}`, decision === 'Memenuhi Kelayakan Ekspor' ? 'success' : 'error');
            };
            const simulasikanSuhu = () => {
                const updated = { ...lot, tempGap: true, axisA: 'deviasi_terdeteksi', history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Deteksi kegagalan pada mekanisme operasional rantai dingin (Cold Chain). Degradasi mutu potensial didokumentasikan.`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Anomali pengendalian suhu berhasil direkam pada audit.", "info");
            };
            const handleKoreksi = (e) => {
                e.preventDefault();
                const updated = { ...lot, weight: parseFloat(koreksiForm.newVal), axisA: 'memadai', history: [...lot.history, { time: new Date().toLocaleString(), actor: user.name, action: `Rekonsiliasi Sistem Otoritas: Parameter biomassa dikalibrasi dari nilai ${koreksiForm.oldVal} menuju angka ${koreksiForm.newVal}. Justifikasi perbaikan: ${koreksiForm.reason}`}] };
                updateLots(lots.map(l => l.id === lot.id ? updated : l)); showToast("Ketetapan koreksional direkam dalam buku log audit sistem.", "success");
            };

            const downloadPDF = () => {
                showToast("Mempersiapkan dokumen Sertifikat Kesehatan...", "info");
                const container = document.getElementById('pdf-certificate-container');
                container.style.display = 'block';
                const element = document.getElementById('pdf-certificate-content');
                
                const opt = { 
                    margin: [30, 30, 30, 30], 
                    filename: `HealthCertificate_${lot.id}.pdf`, 
                    image: { type: 'jpeg', quality: 0.98 }, 
                    html2canvas: { scale: 2, useCORS: true }, 
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
                };
                
                html2pdf().set(opt).from(element).save().then(()=> {
                    container.style.display = 'none';
                    showToast("Dokumen Sertifikat Kesehatan berhasil diunduh secara resmi.", "success");
                }).catch((err) => {
                    container.style.display = 'none';
                    showToast("Terdapat anomali teknis saat mengekspor dokumen.", "error");
                });
            };

            const TABS = ['Inspeksi & Uji Klinis', 'Validasi Serah Terima', 'Kalkulasi Neraca Massa', 'Pohon Silsilah Komoditas', 'Pengendalian Rantai Dingin', 'Buku Log Audit'];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-6xl mx-auto fade-in pb-24">
                    <div className="flex items-center gap-4 mb-6">
                        <button onClick={onBack} className="bg-white p-3 rounded-2xl shadow-sm border"><i className="fas fa-arrow-left"></i></button>
                        <div>
                            <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                Identitas Dokumen: <span className="font-mono text-white bg-situna-main px-3 py-1 rounded-lg text-lg shadow-sm border border-gray-100">{lot.id}</span>
                            </h2>
                        </div>
                    </div>

                    <div className="glass-card p-6 rounded-3xl mb-6 shadow-sm border-t-4 border-t-situna-main">
                        <h4 className="text-sm font-bold text-gray-700 mb-6 uppercase tracking-wider text-center">Status Rantai Pasok Terkini</h4>
                        <div className="flex justify-between relative max-w-4xl mx-auto mb-2 px-8">
                            <div className="absolute top-4 left-16 right-16 h-1 bg-gray-200 z-0">
                                <div className="h-full bg-situna-main transition-all duration-700" style={{width: `${((lot.stage - 1) / 3) * 100}%`}}></div>
                            </div>
                            {[1, 2, 3, 4].map(step => (
                                <div key={step} className="flex flex-col items-center z-10 w-24">
                                    <div className={`step-circle text-sm transition-colors duration-500 ${lot.stage >= step ? 'bg-situna-main text-white shadow-md' : 'bg-gray-200 text-gray-500'}`}>
                                        {lot.stage > step ? <i className="fas fa-check"></i> : step}
                                    </div>
                                    <span className={`text-[10px] font-bold uppercase mt-3 text-center ${lot.stage >= step ? 'text-situna-dark' : 'text-gray-400'}`}>
                                        {step === 1 ? 'Pendaratan' : step === 2 ? 'Fasilitas UPI' : step === 3 ? 'Karantina' : 'Sertifikasi'}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 space-y-6">
                            <div className="glass-card p-6 rounded-3xl shadow-sm text-center">
                                <canvas ref={qrRef} className="rounded-xl mx-auto border p-2 bg-white shadow-sm mb-4"></canvas>
                                <h3 className="font-bold text-gray-800 text-lg leading-tight">{lot.species}</h3>
                                <p className="text-xs text-gray-500 mt-1"><i className="fas fa-ship text-situna-main mr-1"></i> {lot.catchInfo?.kapal} | <i className="fas fa-map-marker-alt text-situna-main mx-1"></i> {lot.catchInfo?.wpp}</p>
                                <div className="mt-4 bg-gray-50 p-4 rounded-xl border flex justify-between items-center text-left">
                                    <div><p className="text-[10px] font-bold text-gray-400 uppercase">Biomassa Terekam</p><p className="text-2xl font-black text-situna-dark">{lot.weight} <span className="text-sm">kg</span></p></div>
                                </div>
                                <div className="mt-4 text-[10px] text-gray-500 flex justify-center gap-2 items-center bg-blue-50 py-1.5 rounded-lg border border-blue-100">
                                    <i className="fas fa-paperclip text-situna-main"></i> <span>Administrasi: {lot.catchInfo?.doc} (Validasi Anti-IUU)</span>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-2">
                            <div className="glass-card rounded-3xl overflow-hidden shadow-xl border border-white">
                                <div className="flex border-b border-gray-200 overflow-x-auto bg-gray-50/50">
                                    {TABS.map(t => (
                                        <button key={t} onClick={() => setTab(t)} className={`px-5 py-4 font-bold text-[11px] uppercase tracking-wider whitespace-nowrap transition-colors ${tab === t ? 'border-b-2 border-situna-main text-situna-dark bg-white' : 'text-gray-400 hover:bg-gray-100'}`}>{t}</button>
                                    ))}
                                </div>
                                
                                <div className="p-6 md:p-8 min-h-[350px]">
                                    {tab === TABS[0] && (
                                        <div className="space-y-6 fade-in">
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <div className="border rounded-xl p-3"><h4 className="text-[10px] font-bold text-gray-400 uppercase mb-2">Verifikasi Dokumen</h4><Badge label={lot.axisA.replace('_', ' ')} color={lot.axisA === 'memadai' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} /></div>
                                                <div className="border rounded-xl p-3"><h4 className="text-[10px] font-bold text-gray-400 uppercase mb-2">Penanganan Operasional</h4><Badge label={lot.axisB.replace('_', ' ')} color={lot.axisB === 'tidak_terindikasi' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'} /></div>
                                                <div className="border border-blue-300 rounded-xl p-3 bg-blue-50/50"><h4 className="text-[10px] font-bold text-blue-800 uppercase mb-2">Ketetapan Klinis</h4><Badge label={lot.axisC.replace('_', ' ')} color={lot.axisC.includes('memenuhi') ? 'bg-green-500 text-white' : lot.axisC.includes('ditolak') ? 'bg-red-500 text-white' : 'bg-blue-200 text-blue-800'} /></div>
                                            </div>

                                            {user.role === 'karantina' && lot.stage >= 2 && lot.stage < 4 && (
                                                <form onSubmit={(e) => e.preventDefault()} className="bg-gray-50 border p-4 rounded-xl space-y-3">
                                                    <p className="text-xs font-bold text-gray-700 mb-2 border-b pb-2"><i className="fas fa-microscope text-situna-main mr-2"></i>Formulir Pengujian Laboratorium Barantin</p>
                                                    <div className="grid grid-cols-2 gap-3 text-xs">
                                                        <div><label className="block text-gray-500 mb-1">Konsentrasi Histamin (ppm)</label><input type="number" value={labForm.histamine} onChange={e=>setLabForm({...labForm, histamine: e.target.value})} className="w-full border rounded p-2" /></div>
                                                        <div><label className="block text-gray-500 mb-1">Pemeriksaan Parasitologi</label><select value={labForm.parasit} onChange={e=>setLabForm({...labForm, parasit: e.target.value})} className="w-full border rounded p-2"><option>Absensi Parasit</option><option>Teridentifikasi Patogen</option></select></div>
                                                        <div className="col-span-2"><label className="block text-gray-500 mb-1">Tingkat Cemaran Logam Berat (Pb/Hg)</label><select value={labForm.metals} onChange={e=>setLabForm({...labForm, metals: e.target.value})} className="w-full border rounded p-2"><option>Kesesuaian Standar Aman</option><option>Melebihi Ambang Batas Toksisitas</option></select></div>
                                                    </div>
                                                    <div className="flex gap-2 mt-4 pt-2">
                                                        <button onClick={(e) => handleLabTest(e, 'Penolakan Otorisasi Ekspor')} className="flex-1 bg-red-100 text-red-700 font-bold py-2 rounded-lg text-xs">Tolak Sertifikasi</button>
                                                        <button onClick={(e) => handleLabTest(e, 'Memenuhi Kelayakan Ekspor')} className="flex-1 bg-green-500 text-white font-bold py-2 rounded-lg text-xs shadow-md">Terbitkan Ketetapan Kelayakan (Health Certificate)</button>
                                                    </div>
                                                </form>
                                            )}
                                            {lot.stage === 4 && (
                                                <button onClick={downloadPDF} className="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                                                    <i className="fas fa-file-pdf"></i> Ekspor Dokumen Sertifikat Kesehatan (PDF)
                                                </button>
                                            )}
                                        </div>
                                    )}

                                    {tab === TABS[1] && (
                                        <div className="space-y-6 fade-in">
                                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100"><i className="fas fa-handshake mr-2"></i><strong>Protokol Serah Terima:</strong> Komoditas didistribusikan dari otoritas pelabuhan perikanan menuju Fasilitas Pengolahan (UPI). Pihak penerima melaksanakan verifikasi pengukuran biomassa independen.</div>

                                            <div className="flex items-center justify-between border rounded-xl p-4 bg-white relative">
                                                <div className="text-center flex-1">
                                                    <p className="text-[10px] font-bold text-gray-400 uppercase">OTORITAS PELABUHAN</p>
                                                    <p className="font-bold text-sm mt-1">{lot.handover.sender}</p>
                                                    <p className="text-xs text-gray-500 mt-1">{lot.handover.senderW} kg</p>
                                                </div>
                                                <div className="text-2xl text-gray-300"><i className="fas fa-arrow-right"></i></div>
                                                <div className="text-center flex-1">
                                                    <p className="text-[10px] font-bold text-gray-400 uppercase">FASILITAS PENGOLAHAN (UPI)</p>
                                                    <p className="font-bold text-sm mt-1">{lot.handover.receiver || 'Belum Diidentifikasi'}</p>
                                                    <p className="text-xs text-gray-500 mt-1">{lot.handover.receiverW ? `${lot.handover.receiverW} kg` : 'Dalam Proses Tunggu'}</p>
                                                </div>
                                            </div>
                                            {(user.role === 'nelayan' || user.role === 'admin') && lot.handover.status === 'Di Pelabuhan' && (
                                                <button onClick={handleKirim} className="bg-situna-dark text-white px-4 py-2 rounded-lg text-xs font-bold w-full">Instruksikan Distribusi ke Fasilitas UPI</button>
                                            )}
                                            {user.role === 'pengolah' && lot.handover.status === 'Menunggu Penerima' && (
                                                <form onSubmit={handleTerima} className="bg-gray-50 border p-4 rounded-xl flex items-end gap-4">
                                                    <div className="flex-1"><label className="block text-[10px] font-bold text-gray-500 uppercase mb-1">Verifikasi Biomassa Diterima (kg)</label><input required type="number" step="0.1" value={serahForm.rWeight} onChange={e=>setSerahForm({...serahForm, rWeight: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="Input Pengukuran Aktual" /></div>
                                                    <button type="submit" className="bg-green-500 text-white px-4 py-2 rounded text-xs font-bold h-[38px] shadow-sm">Konfirmasi Penerimaan</button>
                                                </form>
                                            )}
                                        </div>
                                    )}

                                    {tab === TABS[2] && (
                                        <div className="space-y-6 fade-in">
                                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100"><i className="fas fa-balance-scale mr-2"></i><strong>Kalkulasi Neraca Massa:</strong> Komparasi rasio bahan baku (input) terhadap komoditas akhir, hasil sampingan, dan persentase penyusutan. Deviasi direkam secara akurat.</div>

                                            {lot.processInfo ? (
                                                <div className="border rounded-xl p-6 bg-white grid grid-cols-2 gap-4 text-center">
                                                    <div className="bg-gray-50 p-3 rounded"><p className="text-[10px] text-gray-400 font-bold uppercase">Volume Bahan Baku (Input)</p><p className="text-lg font-bold">{lot.processInfo.original} kg</p></div>
                                                    <div className="bg-green-50 p-3 rounded"><p className="text-[10px] text-green-600 font-bold uppercase">Volume Hasil Pengolahan</p><p className="text-lg font-bold text-green-700">{lot.processInfo.product} kg</p></div>
                                                    <div className="col-span-2 text-xs text-gray-500 mt-2">Deviasi Penyusutan Terukur: <strong>{lot.processInfo.diff.toFixed(2)} kg</strong></div>
                                                </div>
                                            ) : (
                                                user.role === 'pengolah' && lot.handover.status === 'Diterima' ? (
                                                    <form onSubmit={handleNeraca} className="bg-gray-50 border p-4 rounded-xl grid grid-cols-3 gap-4">
                                                        <div><label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Komoditas Loin (kg)</label><input required type="number" step="0.1" value={neracaForm.prod} onChange={e=>setNeracaForm({...neracaForm, prod: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                        <div><label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Sampingan (kg)</label><input required type="number" step="0.1" value={neracaForm.byprod} onChange={e=>setNeracaForm({...neracaForm, byprod: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                        <div><label className="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Penyusutan (kg)</label><input required type="number" step="0.1" value={neracaForm.shrink} onChange={e=>setNeracaForm({...neracaForm, shrink: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                        <button type="submit" className="col-span-3 bg-situna-main text-white py-2.5 rounded-lg text-xs font-bold shadow-md mt-2">Kalkulasi Neraca Massa</button>
                                                    </form>
                                                ) : <p className="text-sm text-gray-400 italic text-center py-6">Pemberitahuan Sistem: Otorisasi komoditas wajib terdaftar pada fasilitas UPI bersangkutan.</p>
                                            )}
                                        </div>
                                    )}

                                    {tab === TABS[3] && (
                                        <div className="space-y-6 fade-in">
                                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100"><i className="fas fa-sitemap mr-2"></i><strong>Pohon Silsilah Komoditas:</strong> Tindakan reduksi ukuran (pemotongan loin) akan menginisiasi identitas turunan, namun seluruh riwayat operasional tetap terintegrasi pada data basis kapal penangkap.</div>

                                            <div className="border rounded-xl p-4 bg-white">
                                                <p className="text-[10px] font-bold text-gray-400 uppercase mb-2">Identitas Induk (Sumber Basis):</p>
                                                {lot.parents.length === 0 ? <span className="text-xs text-gray-500 italic">- Dokumen ini merepresentasikan basis data primer -</span> : <div className="text-xs font-mono bg-gray-50 p-2 rounded border">{lot.parents.join(', ')}</div>}
                                            </div>
                                            {user.role === 'pengolah' && (
                                                <form onSubmit={handlePecah} className="bg-gray-50 border p-4 rounded-xl flex items-end gap-4 mt-4">
                                                    <div className="flex-1"><label className="block text-xs text-gray-500 mb-1">Alokasi Produksi B1 (kg)</label><input required type="number" step="0.1" value={pecahForm.w1} onChange={e=>setPecahForm({...pecahForm, w1: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                    <div className="flex-1"><label className="block text-xs text-gray-500 mb-1">Alokasi Produksi B2 (kg)</label><input required type="number" step="0.1" value={pecahForm.w2} onChange={e=>setPecahForm({...pecahForm, w2: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                                                    <button type="submit" className="bg-situna-dark text-white px-4 py-2 rounded text-xs font-bold h-[38px]">Restrukturisasi Kode Produksi</button>
                                                </form>
                                            )}
                                        </div>
                                    )}

                                    {tab === TABS[4] && (
                                        <div className="space-y-6 fade-in">
                                            <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm border border-blue-100"><i className="fas fa-snowflake mr-2"></i><strong>Pengendalian Rantai Dingin (Cold Chain):</strong> Temperatur termodinamika secara konsisten dijaga semenjak penyimpanan palka armada hingga pemrosesan UPI guna mencegah fluktuasi yang menginduksi degradasi kualitas.</div>

                                            <div className="border rounded-xl p-6 bg-white text-center">
                                                {lot.tempGap ? (
                                                    <div><i className="fas fa-exclamation-triangle text-yellow-500 text-4xl mb-3"></i><h4 className="font-bold text-gray-800">Anomali Suhu Teridentifikasi</h4><p className="text-xs text-gray-500 mt-2">Ditemukan anomali peningkatan parameter temperatur di luar standar batas wajar pada audit data pencatatan.</p></div>
                                                ) : (
                                                    <div><i className="fas fa-check-circle text-green-500 text-4xl mb-3"></i><h4 className="font-bold text-gray-800">Stabilitas Parameter Suhu Optimal</h4><p className="text-xs text-gray-500 mt-2">Mekanisme rantai dingin terpantau ideal sepanjang tahapan distribusi komoditas.</p></div>
                                                )}
                                            </div>
                                            {user.role === 'admin' && !lot.tempGap && <button onClick={simulasikanSuhu} className="w-full bg-yellow-100 text-yellow-700 py-2 rounded-lg font-bold text-xs border border-yellow-200"><i className="fas fa-magic mr-1"></i> Uji Simulasi Kegagalan Rantai Dingin</button>}
                                        </div>
                                    )}

                                    {tab === TABS[5] && (
